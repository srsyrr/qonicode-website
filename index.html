<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QoniCode | Email automation, coming soon</title>
<meta name="description" content="Email automation that finds your customers well. Rule-based email flows for online stores, tested before they go live. Website coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Viga&display=swap" rel="stylesheet">
<style>
  :root {
    --tea-green: #c8d69b;
    --vanilla:   #f6e6a5;
    --celtic:    #3971b8;
    --ivory:     #fbfcee;
    --brown:     #343b1b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ivory);
    color: var(--brown);
    font-family: "Viga", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 400;              /* Viga has one weight; avoid faux bold */
    display: flex; align-items: center; justify-content: center;
    padding: 24px; line-height: 1.5;
  }
  main { max-width: 560px; width: 100%; text-align: center; }
  .badge {
    display: inline-block; padding: 6px 16px;
    background: var(--vanilla); color: var(--brown);
    border-radius: 999px; font-size: 13px; letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 28px;
  }
  .wordmark { font-size: clamp(2.6rem, 11vw, 4rem); margin: 0; letter-spacing: -0.01em; line-height: 1.1; }
  .wordmark .q { color: var(--celtic); }   /* blue only on the Q */
  .bar { width: 72px; height: 6px; border-radius: 3px; background: var(--tea-green); margin: 20px auto 28px; }
  h1 { font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 400; margin: 0 0 14px; line-height: 1.3; }
  p { margin: 0; font-size: 1.05rem; opacity: .85; }
  footer { margin-top: 44px; font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<main>
  <span class="badge">Coming soon</span>
  <p class="wordmark" aria-label="QoniCode"><span class="q">Q</span>oniCode</p>
  <div class="bar" aria-hidden="true"></div>
  <h1>Email automation that finds your customers well.</h1>
  <p>Rule-based email flows for online stores, tested before they go live.</p>
  <footer>&copy; 2026 QoniCode</footer>
</main>
</body>
</html>
